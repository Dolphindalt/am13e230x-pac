name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  generated:
    name: Generated code is up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Installs the toolchain pinned in rust-toolchain.toml.
      - run: rustup toolchain install
      # Partial cache hits are safe. The xtask reinstalls any tool at the wrong version.
      - uses: actions/cache@v4
        with:
          path: target/tools
          key: tools-${{ runner.os }}-${{ hashFiles('xtask/src/main.rs') }}
          restore-keys: tools-${{ runner.os }}-
      - run: cargo xtask check

  probe-rs-target:
    name: probe-rs target is up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install
      - uses: actions/cache@v4
        with:
          path: target/tools
          key: target-gen-${{ runner.os }}-${{ hashFiles('xtask/src/main.rs') }}
          restore-keys: target-gen-${{ runner.os }}-
      - run: cargo xtask probe-rs-target --check

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install
      - run: cargo fmt --all --check
      - run: cargo clippy --locked -p xtask -- -D warnings
      - run: >-
          cargo clippy --locked -p am13e230x-pac --target thumbv8m.main-none-eabihf
          --features rt,critical-section,defmt,debug -- -D warnings
      - run: cargo clippy --locked --release -- -D warnings
        working-directory: examples/lp-am13e230
      - run: >-
          cargo doc --locked --no-deps -p am13e230x-pac --target thumbv8m.main-none-eabihf
          --features rt,critical-section,defmt,debug
        env:
          RUSTDOCFLAGS: -D warnings

  build:
    name: Build (features "${{ matrix.features }}")
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        features: ["", rt, critical-section, defmt, debug, "rt,critical-section,defmt,debug"]
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install
      - run: >-
          cargo build --locked -p am13e230x-pac --target thumbv8m.main-none-eabihf
          --features "${{ matrix.features }}"

  msrv:
    name: MSRV (Rust 1.85)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install
      - run: rustup toolchain install 1.85.0 --profile minimal --target thumbv8m.main-none-eabihf
      # Extracted outside the repo. Inside it, Cargo rejects the package as an unlisted workspace member.
      - run: |
          cargo package --locked --no-verify -p am13e230x-pac
          tar -xzf target/package/am13e230x-pac-*.crate -C "$RUNNER_TEMP"
          cd "$RUNNER_TEMP"/am13e230x-pac-*/
          CARGO_RESOLVER_INCOMPATIBLE_RUST_VERSIONS=fallback cargo generate-lockfile
          cargo +1.85.0 build --target thumbv8m.main-none-eabihf --features rt,critical-section,defmt,debug

  latest-deps:
    name: Build with latest dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install
      - run: cargo update --verbose
      - run: >-
          cargo build -p am13e230x-pac --target thumbv8m.main-none-eabihf
          --features rt,critical-section,defmt,debug

  examples:
    name: Build LaunchPad examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install
      - run: cargo build --locked --release
        working-directory: examples/lp-am13e230
