      STATUS_EXTERNAL_FIFO_FULL: [0x1, "The XFIFO is signaling as full (the FIFO full signal is high). Attempts to write in this case are stalled until the XFIFO full signal goes low or the counter times out as specified by the MAXWAIT field."]
    CELOW:
