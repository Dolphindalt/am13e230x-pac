      FIFOLVL_WRITE_FULL_ERR_INT_ENABLE: [0x1, "This bit enables the Write Full error interrupt (WTFULL in the EPIEISC register) to be generated when a write is attempted and the WFIFO is full. The write stalls until a WFIFO entry becomes available."]
