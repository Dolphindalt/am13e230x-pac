      STATUS_EXTERNAL_FIFO_EMPTY: [0x1, "The XFIFO is signaling as empty (the FIFO empty signal is high). Attempts to read in this case are stalled until the XFIFO empty signal goes low or the counter times out as specified by the MAXWAIT field."]
    XFFULL:
