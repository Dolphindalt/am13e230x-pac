# Registers and fields from hw_epi.h, reset values from the TRM (SPRUJF2B, 16.6). The reset
# values at offsets 0x10, 0x14 and 0x310 to 0x31C are measured on an AM13E23019.
# The mode registers of the four EPI modes share offsets, as alternate registers.
_add:
