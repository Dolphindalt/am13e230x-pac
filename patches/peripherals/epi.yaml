  CFG:
    MODE:
      CFG_MODE_GP: [0x0, "General Purpose. General-Purpose mode. Control, address, and data pins are configured using the EPIGPCFG and EPIGPCFG2 registers."]
      CFG_MODE_SDRAM: [0x1, "SDRAM. Supports SDR SDRAM. Control, address, and data pins are configured using the EPISDRAMCFG register."]
      CFG_MODE_HB8: [0x2, "8-Bit Host-Bus (HB8). Host-bus 8-bit interface (also known as the MCU interface). Control, address, and data pins are configured using the EPIHB8CFG and EPIHB8CFG2 registers."]
      CFG_MODE_HB16: [0x3, "16-Bit Host-Bus (HB16). Host-bus 16-bit interface (standard SRAM). Control, address, and data pins are configured using the EPIHB16CFG and EPIHB16CFG2 registers."]
    BLKEN:
      CFG_EPI_DISABLE: [0x0, "The EPI controller is disabled."]
      CFG_EPI_ENABLE: [0x1, "The EPI controller is enabled."]
    INTDIV:
      CFG_BAUD_DIVIDE_FORMULA: [0x0, "EPIBAUD register values create formula clock divide."]
      CFG_BAUD_DIVIDE_INTEGER: [0x1, "EPIBAUD register values create integer clock divide."]
  GPCFG:
    DSIZE:
      GPCFG_BUS_SIZE_8: [0x0, "8 bits wide (EPI0S0 to EPI0S7)"]
      GPCFG_BUS_SIZE_16: [0x1, "16 bits wide (EPI0S0 to EPI0S15)"]
      GPCFG_BUS_SIZE_24: [0x2, "24 bits wide (EPI0S0 to EPI0S23)"]
      GPCFG_BUS_SIZE_32: [0x3, "32 bits wide (EPI0S0 to EPI0S31)This size may not be used with an EPI clock. This value is normally used for acquisition input and actuator control as well as other general-purpose uses that require 32 bits per direction."]
    ASIZE:
      GPCFG_ADDR_SIZE_NONE: [0x0, "No address"]
      GPCFG_ADDR_SIZE_4: [0x1, "Up to 4 bits wide."]
      GPCFG_ADDR_SIZE_12: [0x2, "Up to 12 bits wide. This size cannot be used with 24-bit data."]
      GPCFG_ADDR_SIZE_20: [0x3, "Up to 20 bits wide. This size cannot be used with data sizes other than 8."]
    RD2CYC:
      GPCFG_READ_ONE_CYCLE: [0x0, "Data is captured on the EPI clock cycle with READ strobe asserted."]
      GPCFG_READ_TWO_CYCLE: [0x1, "Reads are two EPI clock cycles, with address on one EPI clock cycle (with the RD strobe asserted) and data captured on the following EPI clock cycle (with the RD strobe de-asserted). The next address (if any) is in the cycle following."]
