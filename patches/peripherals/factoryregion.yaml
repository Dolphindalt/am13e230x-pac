# Registers and fields from hw_factoryregion.h, reset values from the TRM (SPRUJF2B, 3.16).
_add:
  FACTORYREGION:
    description: "Factory-programmed device data (read-only)"
    groupName: FACTORYREGION
    baseAddress: 0x60111000
    addressBlock:
      offset: 0x0
      size: 0x78
      usage: registers
FACTORYREGION:
  _add:
    TRACEID:
      description: "Defined by TI, during ATE, based on wafer"
      addressOffset: 0x0
      size: 32
      access: read-only
      resetValue: 0x00000000
      fields:
        DATA:
          description: "DATA"
          bitOffset: 0
          bitWidth: 32
    DEVICEID:
      description: "DEVICEID"
      addressOffset: 0x4
      size: 32
      access: read-only
      resetValue: 0x1bbb702f
      fields:
        ALWAYS_1:
          description: "This is always 1"
          bitOffset: 0
          bitWidth: 1
        MANUFACTURER:
          description: "TI's JEDEC bank and company code, which is: 00000010111b"
          bitOffset: 1
          bitWidth: 11
        PARTNUM:
          description: "Part number of the device."
          bitOffset: 12
          bitWidth: 16
        VERSION:
          description: "Revision of the device. This field should change each time that the logic or mask set of the device is revised."
          bitOffset: 28
          bitWidth: 4
    USERID:
      description: "Defined by TI, depending on device spin"
      addressOffset: 0x8
      size: 32
      access: read-only
      resetValue: 0x00000000
      fields:
        PART:
          description: "Bit pattern that uniquely identifying a part. This is used to identify the specific part based on the die identified in DEVICEID.device. This number shall be selected at random among the remaining numbers for DEVICEID.device such that the order of creation cannot be inferred by the number. This value does not encode the part number directly."
          bitOffset: 0
          bitWidth: 16
        VARIANT:
          description: "Bit pattern uniquely identifying a variant of a part. This is used to indicate memory or package variations of the same part number. This number shall be selected at random among the remaining numbers for the relevant combination of IDCODE.device and USERCODE.part such that the order of creation cannot be inferred by the number. The variant number does not encode specifics of the variant directly."
          bitOffset: 16
          bitWidth: 8
        MINORREV:
          description: "Monotonic increasing value indicating a new revision of the SKU that preserves compatibility with lesser minorrev values. New capability may be introduced such that lesser minorrev numbers may not be compatible with greater if the new capability is used."
          bitOffset: 24
          bitWidth: 4
        MAJORREV:
          description: "Monotonic increasing value indicating a new revision of the SKU significant enough that users of the device may have to revise PCB or or software design"
          bitOffset: 28
          bitWidth: 3
        START:
          description: "START"
          bitOffset: 31
          bitWidth: 1
    BSLPIN_UART:
      description: "BSL UART Pin Configuration"
      addressOffset: 0xc
      size: 32
      access: read-only
      resetValue: 0x00000000
      fields:
        UART_RXD_PAD:
