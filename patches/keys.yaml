# These registers ignore a write unless their KEY field holds the register's key.
# Positions and values from the SDK headers (<MODULE>_<REG>_KEY_*). The GSC and XBAR
# keys, which the headers leave out, are from the TRM (SPRUJF2B, sections 15.3 and 20.4).

# hw_adc.h
ADC0:
  _clusters:
    GPRCM:
      PWREN:
        _add:
          KEY:
            description: "Write key: the write only takes effect if KEY is 0x26"
            bitOffset: 24
            bitWidth: 8
            access: write-only
        KEY:
          UNLOCK: [0x26, "KEY to allow write access to this register"]
      RSTCTL:
        _add:
          KEY:
            description: "Write key: the write only takes effect if KEY is 0xB1"
            bitOffset: 24
            bitWidth: 8
            access: write-only
        KEY:
          UNLOCK: [0xB1, "KEY to allow write access to this register"]

